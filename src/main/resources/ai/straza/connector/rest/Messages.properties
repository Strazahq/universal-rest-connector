# Display names and help texts for the connector configuration.

universal.rest.connector.display=Universal REST Connector

baseUrl.display=Base URL
baseUrl.help=REST API base URL, for example https://api.example.com:8443

apiToken.display=API Token
apiToken.help=The bearer token sent on every request this connector makes. One token serves every object class, so its scope must cover everything the schema file declares, reads and writes alike. The schema file's "target" block says how to mint one for your server; a rejected token surfaces that sentence.

emitAgenticUrn.display=Emit Agentic URN
emitAgenticUrn.help=Gate for a schema file's create-only schema URNs that name "emitAgenticUrn" as their configGate. When true (default) such a URN is added to a create document whenever its condition holds, for example marking an account as a non-human identity. Set false to opt out entirely. A file that declares no such URN is unaffected.

trustAllCertificates.display=Trust All TLS Certificates
trustAllCertificates.help=Development only. When true the connector accepts any TLS certificate presented by the server. Leave false in production and trust the server's certificate in the JVM truststore.

connectTimeout.display=Connect Timeout (seconds)
connectTimeout.help=TCP connection timeout in seconds (1-300, default 10).

readTimeout.display=Read Timeout (seconds)
readTimeout.help=Response read timeout in seconds (1-600, default 30).

schemaFilePath.display=Schema File Path
schemaFilePath.help=Absolute path to the JSON schema file. It declares every object class the connector offers, with its endpoints, attributes, wire paths and operations, so onboarding a resource is configuration rather than code. Required for schema(), Search, LiveSync and every write.

testEndpoint.display=Test Endpoint
testEndpoint.help=Optional relative path probed by the Test operation, for example /v1/admin/overview. When blank, Test only checks that the base URL is reachable.
