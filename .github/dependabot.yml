version: 2

# The pom resolves the ConnId parent from Evolveum's public Nexus, and
# Dependabot can only reach registries declared here.
registries:
  evolveum-releases:
    type: maven-repository
    url: https://nexus.evolveum.com/nexus/content/repositories/releases
  evolveum-snapshots:
    type: maven-repository
    url: https://nexus.evolveum.com/nexus/content/repositories/snapshots

updates:
  - package-ecosystem: maven
    directory: /
    registries:
      - evolveum-releases
      - evolveum-snapshots
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
