name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: a release resolves every artifact fresh.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build, test and generate the SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TIMESTAMP: ${{ steps.version.outputs.timestamp }}
        run: |
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B -ntp verify -Dproject.build.outputTimestamp="$TIMESTAMP"

      - name: Collect release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp "target/universal-rest-connector-$VERSION.jar" "target/universal-rest-connector-$VERSION.cdx.json" dist/
          unzip -p "dist/universal-rest-connector-$VERSION.jar" META-INF/MANIFEST.MF \
            | tr -d '\r' | grep -qxF "ConnectorBundle-Version: $VERSION"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      # Artifact attestations need a public repository (or GitHub Enterprise Cloud).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.jar
            dist/*.cdx.json

      - name: Attest SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.jar
          sbom-path: dist/universal-rest-connector-${{ steps.version.outputs.version }}.cdx.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
